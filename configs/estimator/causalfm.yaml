# @package estimator
# CausalFM checkpoint, wrapped as an Estimator. Requires the [cfm] extra.
name: causalfm
target: bkrobust.cfm.adapters.causalfm.CausalFMAdapter

checkpoint: null
revision: null
device: ${compute.device}
dtype: float32
batch_size: 64

estimand: ate
requires_scm: false

conditioning:
  mode: attention_bias
  bias_scale: 1.0
  encode_forbidden: true
  symmetrize: false
