[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bkrobust"
version = "0.1.0"
description = "Robustness of causal effect estimation to consistent-but-false background knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = [
    "causal-discovery",
    "background-knowledge",
    "adjustment-sets",
    "mpdag",
    "robustness",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

# ---------------------------------------------------------------------------
# DECISION POINT (unresolved): causal-discovery backend.
#
# The graph module needs a PC/GES implementation to produce the CPDAG that
# background knowledge is imposed on. Two candidates, deliberately NOT chosen
# here -- pick one before the first experiment lands and move it into
# `dependencies` above.
#
#   causal-learn  (CMU, MIT licence, pure Python, actively maintained)
#     + reference implementations of PC/FCI/GES, Meek rules already present
#     + easy to read and to diff our MPDAG closure against
#     - slower on dense graphs; API churn between minor versions
#     "causal-learn>=0.1.3",
#
#   gcastle  (Huawei Noah's Ark, Apache-2.0)
#     + broader algorithm zoo incl. gradient-based (NOTEARS, DAG-GNN)
#     + faster on larger n
#     - pulls in torch even for classical algorithms; heavier install
#     "gcastle>=1.0.3",
#
# Note: b-LOAD's Meek/MPDAG closure is the intended starting point for
# `bkrobust.graphs.meek`, which reduces (but does not remove) the dependency.
# ---------------------------------------------------------------------------

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "nbstripout>=0.7",
]
cfm = [
    "torch>=2.3",
    "transformers>=4.44",
]

[project.urls]
Repository = "https://anonymous.4open.science/r/bkrobust"

[tool.hatch.build.targets.wheel]
packages = ["src/bkrobust"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "experiments", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "RUF",
]
ignore = [
    "D105",   # magic method docstrings
    "D107",   # __init__ docstring (documented on the class)
    "ANN401", # allow typing.Any where a protocol genuinely needs it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201", "ANN001"]
"experiments/*" = ["D100"]
# Notebooks are scratch space: imports are staged for cells that are still
# commented out, so unused-import and import-order rules only add noise.
"notebooks/*" = ["F401", "I001", "E402", "D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src", "experiments", "tests"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "networkx.*",
    "scipy.*",
    "sklearn.*",
    "hydra.*",
    "omegaconf.*",
    "matplotlib.*",
    "tqdm.*",
    "torch.*",
    "transformers.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: exact/exhaustive searches that are too slow for CI",
    "cfm: requires the [cfm] extra and downloaded checkpoints",
]
