# Is a run of E14 really E14? Checked with experiments/rebuttal/fidelity_gate.py, apart from the score.
arm: E14-data-test-for-invalid-sets
says: >
  Every distinct released state with a committed set, rebuilt and verified against its row; up to 20
  sets GAC-valid in G0 with the committed set first; 50 replicates of a unit-variance linear SEM on
  the true DAG with non-Gaussian noise at n = 1,000 and 10,000; the Su-Henckel coefficient-agreement
  Wald test with an estimated rank at alpha 0.05; detection on committed sets GAC-invalid at truth,
  false alarm on GAC-valid ones.
repo: ../../..                      # repository root, relative to this file
code:
  - experiments/rebuttal/E14_data_test_for_invalid_sets/run.py
  - experiments/rebuttal/E14_data_test_for_invalid_sets/coef_test.py
  - experiments/rebuttal/E14_data_test_for_invalid_sets/sem_sampler.py
  - experiments/rebuttal/E14_data_test_for_invalid_sets/vendor_optimal.py
  - experiments/rebuttal/E14_data_test_for_invalid_sets/vendor_ledger.py
runs: ../../../results/rebuttal/E14/config*.json
rubric:
  - id: criterion
    says: validity in G0 and at truth is decided by the GAC
    config: {key: criterion, equals: gac}
  - id: not-smoke
    says: the full run, not the smoke subset
    config: {key: smoke, equals: false}
  - id: reps
    says: 50 replicates per state
    config: {key: reps, equals: 50}
  - id: n-values
    says: the two registered sample sizes
    config: {key: n_values, equals: [1000, 10000]}
  - id: alpha
    says: level 0.05
    config: {key: alpha, equals: 0.05}
  - id: max-sets
    says: at most 20 sets per state
    config: {key: max_sets, equals: 20}
  - id: seed
    says: the registered seed
    config: {key: seed, equals: 20261106}
  - id: release-seed
    says: D_RAND knowledge rebuilt with the released sweep's seed
    config: {key: release_seed, equals: 20260913}
  - id: rank-rule
    says: the registered rank estimate
    config: {key: rank_rule, equals: "eigenvalue > n^-0.5 * var(psi_Z)"}
  - id: records-file
    says: the released per_query_records.csv, byte for byte (release/SHA256SUMS)
    config: {key: records_sha256, equals: 13541300e559b7aae464d35121b1f5f8a9678209dac99063ba1e31768412452e}
  - id: knowledge-file
    says: the released knowledge_states.json, byte for byte (release/SHA256SUMS)
    config: {key: knowledge_sha256, equals: 45119393225fee57ed1dd4c002130f805d6a655c2ee7648006470918c2dfc7bb}
  - id: clean-src
    says: the submitted src/ was unmodified when the run started
    config: {key: src_dirty, equals: false}
  - id: all-states-run
    says: every selected state has a line and none is left in error
    check: >
      python3 -c "import json,glob,sys; c=[json.load(open(f)) for f in glob.glob('results/rebuttal/E14/config*.json')];
      r={}; [r.__setitem__(x['key'],x) for f in sorted(glob.glob('results/rebuttal/E14/units*.jsonl')) for x in map(json.loads,open(f))];
      sys.exit(0 if c and len(r)==c[0]['n_selected'] and all(x['status']!='error' for x in r.values()) else 1)"
  - id: rebuilt
    says: at least 95% of states rebuild exactly from the released files (else this is not the released population)
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E14/units*.jsonl') for l in open(f)];
      sys.exit(0 if r and sum(x['status']!='rebuild_mismatch' for x in r)>=0.95*len(r) else 1)"
  - id: commit-and-criterion
    says: every row records a repository commit and the GAC
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E14/units*.jsonl') for l in open(f)];
      sys.exit(0 if r and all(x.get('commit') not in (None,'unknown') and x.get('criterion')=='gac' for x in r) else 1)"
  - id: no-hard-failures
    says: no consistency failure (sets valid in G0, DAG/MPDAG GAC agree, truth-valid sets hit the effect)
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E14/units*.jsonl') for l in open(f)];
      sys.exit(0 if r and not any(x.get('hard_failures') for x in r) else 1)"
  - id: committed-first
    says: on every tested state the first compared set is the committed set
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E14/units*.jsonl') for l in open(f)];
      ok=[x for x in r if x['status']=='ok']; sys.exit(0 if ok and all(x['sets'][0]==x['z'] and x['origin'][0]=='committed' for x in ok) else 1)"
  - id: both-groups
    says: both groups exist among tested states (committed set invalid and valid at truth)
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E14/units*.jsonl') for l in open(f)];
      ok=[x for x in r if x['status']=='ok']; sys.exit(0 if any(x['z_valid_at_truth'] is False for x in ok) and any(x['z_valid_at_truth'] for x in ok) else 1)"
  - id: non-gaussian
    says: the SEM noise is non-Gaussian (uniform, Laplace, exponential), as the plan asks
    check: grep -q 'FAMILIES = ("uniform", "laplace", "exponential")' experiments/rebuttal/E14_data_test_for_invalid_sets/sem_sampler.py
  - id: registered-n
    says: results.json reports the registered statistic at n = 10,000
    check: >
      python3 -c "import json,sys; r=json.load(open('results/rebuttal/E14/results.json'));
      sys.exit(0 if r['registered_is_10000'] and r['registered']['delta'] is not None else 1)"
