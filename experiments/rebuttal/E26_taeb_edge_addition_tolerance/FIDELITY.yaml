# Is a run of E26 really E26? Checked with experiments/rebuttal/fidelity_gate.py, apart from the score.
arm: E26-taeb-edge-addition-tolerance
says: >
  Every released status-ok query (3,585 rows, all arms), rebuilt from the released files and verified
  against their hashes; one deterministic DAG D0 of G0's class; the least number of directed edges added
  to D0 under its fixed topological order (ties by name) that make the committed set fail the GAC,
  searched exhaustively to depth 3 with 120 s per query; the acyclic-only tolerance where the order
  tolerance exceeds 1; depth-1 verdicts on two seeded random extensions; every breaking set confirmed by
  the submitted and the released GAC oracles.
repo: ../../..
code:
  - experiments/rebuttal/E26_taeb_edge_addition_tolerance/run.py
  - experiments/rebuttal/E26_taeb_edge_addition_tolerance/vendor_ledger.py
runs: ../../../results/rebuttal/E26/config*.json
rubric:
  - id: criterion
    says: the criterion is the GAC
    config: {key: criterion, equals: gac}
  - id: not-smoke
    says: the full run, not the smoke subset
    config: {key: smoke, equals: false}
  - id: population
    says: all 3,585 released status-ok rows were selected
    config: {key: n_selected, equals: 3585}
  - id: depth
    says: search depth 3
    config: {key: max_depth, equals: 3}
  - id: budget-order
    says: 120 s per query for the order tolerance
    config: {key: time_limit, equals: 120.0}
  - id: budget-acyclic
    says: 60 s per query for the acyclic tolerance
    config: {key: time_limit_acyclic, equals: 60.0}
  - id: extensions
    says: two seeded random extensions, 30 s each
    config: {key: n_random_extensions, equals: 2}
  - id: records-file
    says: the released per_query_records.csv, byte for byte
    config: {key: records_sha256, equals: 13541300e559b7aae464d35121b1f5f8a9678209dac99063ba1e31768412452e}
  - id: knowledge-file
    says: the released knowledge_states.json, byte for byte
    config: {key: knowledge_sha256, equals: 45119393225fee57ed1dd4c002130f805d6a655c2ee7648006470918c2dfc7bb}
  - id: seed
    says: D_RAND knowledge rebuilt with the released sweep's seed
    config: {key: seed, equals: 20260913}
  - id: clean-src
    says: the submitted src/ was unmodified when the run started
    config: {key: src_dirty, equals: false}
  - id: all-rows-ok
    says: all 3,585 rows ran and rebuilt exactly; none in error or mismatch
    check: >
      python3 -c "import json,glob,sys; r={}; [r.__setitem__(x['key'],x) for f in sorted(glob.glob('results/rebuttal/E26/rows*.jsonl')) for x in map(json.loads,open(f))];
      sys.exit(0 if len(r)==3585 and all(x['status']=='ok' for x in r.values()) else 1)"
  - id: no-consistency-failure
    says: no row records a consistency failure (rebuild, D0 validity, witness confirmation, order, sampled moves)
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E26/rows*.jsonl') for l in open(f)];
      sys.exit(0 if r and not any(x.get('hard_failures') for x in r) else 1)"
  - id: order-witness-respects-order
    says: every order witness is a list of at most 3 directed edges and the tolerance equals its length
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E26/rows*.jsonl') for l in open(f)]; r=[x for x in r if x.get('status')=='ok'];
      sys.exit(0 if r and all((x['tol_order']['witness'] is None) or (len(x['tol_order']['witness'])==x['tol_order']['t']<=3) for x in r) else 1)"
  - id: radius-is-released
    says: the radius compared is the released r_hop of the same row
    check: >
      python3 -c "import json,glob,csv,sys; rel={'q|'+'|'.join((d['network'],d['arm'],d['rep'],d['x'],d['y'])):d['r_hop'] for d in csv.DictReader(open('experiments/rebuttal/_data/per_query_records.csv'))};
      r=[json.loads(l) for f in glob.glob('results/rebuttal/E26/rows*.jsonl') for l in open(f)]; r=[x for x in r if x.get('status')=='ok'];
      sys.exit(0 if r and all(rel[x['key']]==x['released_r_hop'] for x in r) else 1)"
