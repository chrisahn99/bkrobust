# Is a run of E25 really E25? Checked with experiments/rebuttal/fidelity_gate.py, apart from the score.
arm: E25-amenability-check
says: >
  For every released query of the E10 frame, every E11 frame query under the eight real-name
  conditions, and every stored synthetic survival instance, the up-set of G0 is enumerated level by
  level with the submitted cover generator; on each state the submitted GAC predicate for the
  committed set and the submitted amenability test are evaluated; r_val and r_amen are the first
  levels holding a failing and a non-amenable state; the submitted radius and the amenability
  search are run and timed beside it; results are compared with the first author's
  amenability_radius.csv.
repo: ../../..
code:
  - experiments/rebuttal/E25_amenability_check/run.py
  - experiments/rebuttal/E25_amenability_check/analyse.py
  - experiments/rebuttal/E25_amenability_check/b_amenability.py
  - experiments/rebuttal/E25_amenability_check/vendor_states.py
  - experiments/rebuttal/E25_amenability_check/vendor_ledger.py
  - experiments/rebuttal/E25_amenability_check/vendor_search.py
runs: ../../../results/rebuttal/E25/config.json
rubric:
  - id: criterion
    says: the criterion is the GAC
    config: {key: criterion, equals: gac}
  - id: not-smoke
    says: the full run, not the smoke subset
    config: {key: smoke, equals: false}
  - id: sources
    says: all three populations
    config: {key: sources, equals: [released, e11, synthetic]}
  - id: released-population
    says: the 3,014 released status-ok rows of the ten elicited arms and D_RAND
    config: {key: n_released, equals: 3014}
  - id: synthetic-population
    says: the 4,584 stored synthetic instances
    config: {key: n_synthetic, equals: 4584}
  - id: records-file
    says: the released per_query_records.csv, byte for byte
    config: {key: records_sha256, equals: 13541300e559b7aae464d35121b1f5f8a9678209dac99063ba1e31768412452e}
  - id: knowledge-file
    says: the released knowledge_states.json, byte for byte
    config: {key: knowledge_sha256, equals: 45119393225fee57ed1dd4c002130f805d6a655c2ee7648006470918c2dfc7bb}
  - id: frames
    says: both E11 frames match their frozen hashes
    config: {key: frame_sha_ok, equals: true}
  - id: elicit-bundle
    says: the elicited bundle E11 used
    config: {key: elicit_sha256, equals: 45119393225fee57ed1dd4c002130f805d6a655c2ee7648006470918c2dfc7bb}
  - id: seed
    says: D_RAND knowledge rebuilt with the released seed
    config: {key: seed, equals: 20260913}
  - id: scan-budget
    says: 200,000 states and 300 s per query for the level scan
    config: {key: scan_max_states, equals: 200000}
  - id: scan-time
    says: 300 s per query
    config: {key: scan_time_limit, equals: 300.0}
  - id: search-budget
    says: 20,000 closures per upward search
    config: {key: closure_budget, equals: 20000}
  - id: clean-src
    says: the submitted src/ was unmodified when the run started
    config: {key: src_dirty, equals: false}
  - id: all-units-written
    says: every selected unit has a row, none left in error
    check: >
      python3 -c "import json,sys; c=json.load(open('results/rebuttal/E25/config.json')); r={};
      [r.__setitem__(x['key'],x) for x in map(json.loads,open('results/rebuttal/E25/rows.jsonl'))];
      sys.exit(0 if len(r)==c['n_units'] and not any(x['status']=='error' for x in r.values()) else 1)"
  - id: commit-per-row
    says: every row records a repository commit and the GAC
    check: >
      python3 -c "import json,sys; r=[json.loads(l) for l in open('results/rebuttal/E25/rows.jsonl')];
      sys.exit(0 if r and all(x.get('commit') not in (None,'unknown') and x.get('criterion')=='gac' for x in r) else 1)"
  - id: scan-ran
    says: every analysed row carries a level scan and both timed radius computations
    check: >
      python3 -c "import json,sys; r=[json.loads(l) for l in open('results/rebuttal/E25/rows.jsonl')]; r=[x for x in r if x.get('status')=='ok'];
      sys.exit(0 if r and all('scan' in x and 'hybrid' in x and 'amen_search' in x and 't_amen_call' in x for x in r) else 1)"
  - id: no-consistency-failure
    says: no row records a consistency failure
    check: >
      python3 -c "import json,sys; r=[json.loads(l) for l in open('results/rebuttal/E25/rows.jsonl')];
      sys.exit(0 if r and not any(x.get('hard_failures') for x in r) else 1)"
