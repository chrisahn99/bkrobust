# Is a run of E17 really E17? Checked with experiments/rebuttal/fidelity_gate.py, apart from the score.
arm: E17-worked-case-and-validity-by-radius
says: >
  The released D_LLM queries of Acid_1996 and Polzer_2012 recomputed and matched to their released rows,
  and the matched-control frame (5 queries per network) at D_LLM and at every stored D_RANDOM_MATCHED
  draw, each with the optimal set at G0, its GAC breakdown radius, its claim radius and witness, and
  its validity at the data-generating DAG under the GAC and the back-door criterion.
repo: ../../..                      # repository root, relative to this file
code:
  - experiments/rebuttal/E17_worked_case_and_validity_by_radius/run.py
  - experiments/rebuttal/E17_worked_case_and_validity_by_radius/vendor_witness.py
  - experiments/rebuttal/E17_worked_case_and_validity_by_radius/analyse.py
runs: ../../../results/rebuttal/E17/config.*.json
rubric:
  - id: criterion
    says: the radius is computed under the generalised adjustment criterion
    config: {key: criterion, equals: gac}
  - id: not-smoke
    says: the full run, not the smoke subset
    config: {key: smoke, equals: false}
  - id: records-file
    says: the released per_query_records.csv, byte for byte (release/SHA256SUMS)
    config: {key: records_sha256, equals: 13541300e559b7aae464d35121b1f5f8a9678209dac99063ba1e31768412452e}
  - id: knowledge-file
    says: the D_LLM knowledge is the released knowledge_states.json (same bytes as results/elicit/knowledge.json)
    config: {key: knowledge_sha256, equals: 45119393225fee57ed1dd4c002130f805d6a655c2ee7648006470918c2dfc7bb}
  - id: draws-file
    says: the random states are the committed matched-control draws
    config: {key: draws_sha256, equals: b3837cb4dff918167fc4cfc61cb72db5ce007f82048790ba6709b82b59963d13}
  - id: frame-file
    says: the queries come from the committed frame
    config: {key: frame_sha256, equals: 6f05f044b13117d731aa345d4d549eebfa0586d7da11ceff953502003c7843fc}
  - id: seed
    says: the matched control's base seed (frame and draws)
    config: {key: seed, equals: 20260917}
  - id: queries
    says: five queries per network, as the matched control
    config: {key: queries_per_network, equals: 5}
  - id: time-limit
    says: the registered per-unit time limit
    config: {key: time_limit, equals: 120.0}
  - id: claim-depth
    says: claim retractions searched to depth 3, as the released records
    config: {key: claim_depth, equals: 3}
  - id: worked-networks
    says: the worked case is chosen from Acid_1996 then Polzer_2012
    config: {key: worked_networks, equals: [Acid_1996, Polzer_2012]}
  - id: clean-src
    says: the submitted src/ was unmodified when the run started
    config: {key: src_dirty, equals: false}
  - id: rows-carry-criterion-and-commit
    says: every row records the GAC and a repository commit
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E17/rows.*.jsonl') for l in open(f) if l.strip()];
      sys.exit(0 if r and all(x.get('criterion')=='gac' and x.get('commit') not in (None,'','unknown') for x in r) else 1)"
  - id: all-units-written
    says: every unit of every shard has a row (no unit silently missing)
    check: >
      python3 -c "import json,glob,sys; c=[json.load(open(f)) for f in glob.glob('results/rebuttal/E17/config.*.json')];
      r={json.loads(l)['key'] for f in glob.glob('results/rebuttal/E17/rows.*.jsonl') for l in open(f) if l.strip()};
      sys.exit(0 if c and len(r)==c[0]['n_units_total'] and len({x['n_shards'] for x in c})==1 and len(c)==c[0]['n_shards'] else 1)"
  - id: both-arms-and-draws
    says: D_LLM and D_RANDOM_MATCHED table rows exist, and all 532 stored draws were re-drawn
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E17/rows.*.jsonl') for l in open(f) if l.strip()];
      t={x['arm'] for x in r if x['kind']=='table'}; d=[x for x in r if x['kind']=='draw'];
      sys.exit(0 if t=={'D_LLM','D_RANDOM_MATCHED'} and len(d)==532 else 1)"
  - id: consistency
    says: no row failed a consistency check (oracles agree, theorem checks hold, draws and released rows reproduced)
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E17/rows.*.jsonl') for l in open(f) if l.strip()];
      sys.exit(0 if r and not any(x.get('checks') for x in r) else 1)"
  - id: enumeration-exercised
    says: the enumeration oracle was actually run on some units (the cross-check is not vacuous)
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E17/rows.*.jsonl') for l in open(f) if l.strip()];
      sys.exit(0 if sum(1 for x in r if x.get('enum_checked'))>=20 else 1)"
  - id: worked-units-compared
    says: the worked-case rows were compared with their released rows
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E17/rows.*.jsonl') for l in open(f) if l.strip()];
      w=[x for x in r if x['kind']=='worked']; sys.exit(0 if len(w)==40 and all('release' in x for x in w) else 1)"
