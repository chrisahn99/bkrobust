# Is a run of E12 really E12? Checked with experiments/rebuttal/fidelity_gate.py, apart from the score.
arm: E12-networks-above-500-nodes
says: >
  The 100 frozen frame rows of link, munin, munin2, munin3 and munin4 under every released
  knowledge condition, each with the GAC check at the CPDAG first, the budgeted upward search and
  the submitted breakdown_radius only where that check fails, timings and censoring recorded, and
  the audit at the true DAG computed after the instruments.
repo: ../../..                      # repository root, relative to this file
code:
  - experiments/rebuttal/E12_networks_above_500_nodes/run.py
  - experiments/rebuttal/E12_networks_above_500_nodes/search.py
  - experiments/rebuttal/E12_networks_above_500_nodes/vendor_ledger.py
  - experiments/rebuttal/E12_networks_above_500_nodes/vendor_optimal.py
  - experiments/rebuttal/E12_networks_above_500_nodes/vendor_audit.py
runs: ../../../results/rebuttal/E12/config*.json
rubric:
  - id: criterion
    says: the registered criterion is the GAC
    config: {key: criterion, equals: gac}
  - id: not-smoke
    says: the full run, not the smoke subset
    config: {key: smoke, equals: false}
  - id: networks
    says: exactly the five networks above 500 nodes
    config: {key: networks, equals: [link, munin, munin2, munin3, munin4]}
  - id: knowledge-file
    says: the released knowledge_states.json, byte for byte (release/SHA256SUMS)
    config: {key: knowledge_sha256, equals: 45119393225fee57ed1dd4c002130f805d6a655c2ee7648006470918c2dfc7bb}
  - id: frame-file
    says: the frozen frame of the submitted tree
    config: {key: frame_sha256, equals: 6f05f044b13117d731aa345d4d549eebfa0586d7da11ceff953502003c7843fc}
  - id: seed
    says: D_RAND rebuilt with the released sweep's seed and three replicates
    config: {key: seed, equals: 20260913}
  - id: reps
    says: three D_RAND replicates
    config: {key: rand_reps, equals: 3}
  - id: budgets
    says: the registered budgets (40000 closures, 120 s search, 60 s hybrid floor, 120 s claims, 900 s oracle)
    config: {key: closure_budget, equals: 40000}
  - id: search-limit
    says: registered search wall clock
    config: {key: search_limit, equals: 120.0}
  - id: hybrid-limit
    says: registered hybrid wall clock floor
    config: {key: hybrid_limit, equals: 60.0}
  - id: claim-limit
    says: registered claim wall clock
    config: {key: claim_limit, equals: 120.0}
  - id: workers
    says: no more than 8 workers on the workstation
    config: {key: workers, in: [1, 2, 3, 4, 5, 6, 7, 8]}
  - id: clean-src
    says: the submitted src/ was unmodified when the run started
    config: {key: src_dirty, equals: false}
  - id: commit-and-criterion-per-row
    says: every row records a known repository commit and the GAC
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)];
      sys.exit(0 if r and all(x.get('commit') not in (None,'unknown') and x.get('criterion')=='gac' and not x.get('smoke') for x in r) else 1)"
  - id: population
    says: all 100 frame rows of the five networks appear, no unit is left in error
    check: >
      python3 -c "import json,glob,sys; r={}; [r.__setitem__(x['key'],x) for f in sorted(glob.glob('results/rebuttal/E12/rows*.jsonl')) for x in map(json.loads,open(f))];
      q={(x['network'],x['x'],x['y']) for x in r.values()}; f=[json.loads(l) for l in open('results/frame/frame.jsonl')];
      want={(x['network'],x['x'],x['y']) for x in f if x['network'] in ('link','munin','munin2','munin3','munin4')};
      sys.exit(0 if len(want)==100 and q==want and all(x['status']!='error' for x in r.values()) else 1)"
  - id: conditions
    says: every released condition is present (10 LLM states, D_RAND, D_DEGEN, A_TRUE, A_ORACLE)
    check: >
      python3 -c "import json,glob,sys; a={json.loads(l)['arm'] for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)};
      sys.exit(0 if len(a)==14 else 1)"
  - id: cpdag-check-first
    says: every certifiable row with retractable edges ran the CPDAG check, and searched only where it failed
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)];
      ok=[x for x in r if x.get('status')=='ok' and x.get('hop_method')!='no_retractable_edges'];
      sys.exit(0 if ok and all(x['top_valid'] in (0,1) and (x['search'] is None)==(x['top_valid']==1) for x in ok) else 1)"
  - id: hybrid-called
    says: the submitted breakdown_radius was called on every row that went to the CPDAG check, and returned top_state wherever the check passed
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)];
      ok=[x for x in r if x.get('status')=='ok' and x.get('top_valid') is not None];
      sys.exit(0 if ok and all(x['hybrid'] and x['hybrid'].get('outcome') and (x['top_valid']==0 or x['hybrid'].get('method')=='top_state') for x in ok) else 1)"
  - id: timings
    says: time per call is recorded for the CPDAG check and the hybrid
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)];
      ok=[x for x in r if x.get('status')=='ok' and x.get('top_valid') is not None];
      sys.exit(0 if ok and all(x['top_seconds'] is not None and x['hybrid'].get('wall_seconds') is not None for x in ok) else 1)"
  - id: truth-after-freeze
    says: the audit fields appear only on rows whose instruments were frozen first
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)];
      sys.exit(0 if all(('z_valid_at_truth' in x)<=('frozen_at' in x) for x in r) else 1)"
  - id: no-consistency-failure
    says: no row recorded a consistency failure
    check: >
      python3 -c "import json,glob,sys; r=[json.loads(l) for f in glob.glob('results/rebuttal/E12/rows*.jsonl') for l in open(f)];
      sys.exit(0 if r and not any(x.get('consistency') for x in r) else 1)"
